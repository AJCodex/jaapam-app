name: jaapam
description: "Jain temple community jaap tracking"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.6.2

  # i18n
  intl: ^0.20.2

  # Fonts (Google Fonts loaded at runtime; switch to bundled assets later for offline)
  google_fonts: ^6.2.1

  # Firebase
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.5.0
  cloud_functions: ^5.1.5
  firebase_messaging: ^15.1.5
  firebase_storage: ^12.3.6
  firebase_app_check: ^0.3.2+1
  firebase_analytics: ^11.3.5

  # Google Sign-In (web uses google_sign_in_web automatically)
  google_sign_in: ^6.2.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true   # enables ARB-based localization codegen
