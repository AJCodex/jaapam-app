<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FAF6EF"/>
      <stop offset="1" stop-color="#FEF3E2"/>
    </linearGradient>
    <linearGradient id="lotus" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4B97B"/>
      <stop offset="1" stop-color="#E68C3A"/>
    </linearGradient>
  </defs>
  <!-- circular cream background -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)" stroke="#E68C3A" stroke-width="2"/>

  <!-- Lotus petals behind yogi -->
  <g fill="url(#lotus)" opacity="0.75">
    <ellipse cx="32" cy="50" rx="22" ry="6"/>
    <ellipse cx="32" cy="50" rx="16" ry="9" fill="#C2410C" opacity="0.55"/>
    <ellipse cx="20" cy="48" rx="6" ry="9" transform="rotate(-25 20 48)"/>
    <ellipse cx="44" cy="48" rx="6" ry="9" transform="rotate(25 44 48)"/>
    <ellipse cx="12" cy="46" rx="5" ry="8" transform="rotate(-40 12 46)"/>
    <ellipse cx="52" cy="46" rx="5" ry="8" transform="rotate(40 52 46)"/>
  </g>

  <!-- Meditating yogi silhouette -->
  <g fill="#C2410C">
    <!-- Head -->
    <circle cx="32" cy="20" r="5"/>
    <!-- Body (triangular meditation posture) -->
    <path d="M22 44 Q32 24 42 44 Z"/>
    <!-- Arms resting on knees -->
    <ellipse cx="22" cy="42" rx="5" ry="3" transform="rotate(-15 22 42)"/>
    <ellipse cx="42" cy="42" rx="5" ry="3" transform="rotate(15 42 42)"/>
  </g>

  <!-- Aura / tilak dot above head -->
  <circle cx="32" cy="11" r="2" fill="#E68C3A"/>
</svg>
